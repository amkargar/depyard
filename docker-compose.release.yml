services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/amkargar/mirror-registry}-backend:${MIRROR_REGISTRY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: mirror_registry
      DATA_DIR: /data
      ENABLE_ROOT_COMPAT_ROUTE: "true"
      DEFAULT_REGISTRY_SLUG: pub-public
      DEFAULT_REGISTRY_NAME: Pub Public Mirror
      DEFAULT_REGISTRY_MODE: hybrid
      DEFAULT_UPSTREAM_URL: https://pub.dev
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
    volumes:
      - registry_blobs:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: ${IMAGE_PREFIX:-ghcr.io/amkargar/mirror-registry}-nginx:${MIRROR_REGISTRY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mongo_data:
  registry_blobs:
