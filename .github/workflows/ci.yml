name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Go vet & race tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        env:
          DEPYARD_TEST_APT_GET: /usr/bin/apt-get
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (Typecheck & Static Generate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate static SPA
        run: npm run generate

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Compose manifests and installer
        run: |
          docker compose config -q
          docker compose -f docker-compose.release.yml config -q
          bash tests/installer_test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build nginx (static SPA) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          load: true
          tags: depyard-gateway:test
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Validate HTTP and TLS gateway listeners
        run: |
          certs=$(mktemp -d)
          trap 'rm -rf "$certs"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout "$certs/key.pem" -out "$certs/cert.pem"
          gateway() {
            docker run --rm -e BACKEND_UPSTREAM=127.0.0.1:8080 -v "$certs:/tls:ro" "$@" depyard-gateway:test nginx -t
          }
          gateway
          gateway -e TLS_CERT_FILE=/tls/cert.pem -e TLS_KEY_FILE=/tls/key.pem
          if gateway -e TLS_CERT_FILE=/tls/cert.pem; then exit 1; fi
