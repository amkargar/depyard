name: Release Container Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go vet & tests
        working-directory: backend
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

  release:
    name: Build, Push GHCR & Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '${TAG}'. Expected semantic tag like v1.0.0 or v1.0.0-rc.1." >&2
            exit 1
          fi

          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_PREFIX="ghcr.io/${REPO_LOWER}"
          BACKEND_IMAGE="${IMAGE_PREFIX}-backend"
          NGINX_IMAGE="${IMAGE_PREFIX}-nginx"

          IS_PRERELEASE="false"
          if [[ "${TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          {
            echo "tag=${TAG}"
            echo "image_prefix=${IMAGE_PREFIX}"
            echo "backend_image=${BACKEND_IMAGE}"
            echo "nginx_image=${NGINX_IMAGE}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "backend_tags<<EOF"
            echo "${BACKEND_IMAGE}:${TAG}"
            if [ "${IS_PRERELEASE}" = "false" ]; then
              echo "${BACKEND_IMAGE}:latest"
            fi
            echo "EOF"
            echo "nginx_tags<<EOF"
            echo "${NGINX_IMAGE}:${TAG}"
            if [ "${IS_PRERELEASE}" = "false" ]; then
              echo "${NGINX_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          labels: |
            org.opencontainers.image.title=Mirror Registry Backend
            org.opencontainers.image.description=Extensible multi-format package and artifact registry server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push multi-arch nginx (static SPA) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.nginx_tags }}
          labels: |
            org.opencontainers.image.title=Mirror Registry Nginx Gateway
            org.opencontainers.image.description=Nginx entrypoint serving the static Nuxt SPA and proxying registry traffic
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Package downloadable container image archives for GitHub Release
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_PREFIX: ${{ steps.meta.outputs.image_prefix }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend_image }}
          NGINX_IMAGE: ${{ steps.meta.outputs.nginx_image }}
        run: |
          mkdir -p dist

          for ARCH in amd64 arm64; do
            echo "Exporting linux/${ARCH} image archive..."
            docker pull --platform "linux/${ARCH}" "${BACKEND_IMAGE}:${RELEASE_TAG}"
            docker pull --platform "linux/${ARCH}" "${NGINX_IMAGE}:${RELEASE_TAG}"
            docker save \
              "${BACKEND_IMAGE}:${RELEASE_TAG}" \
              "${NGINX_IMAGE}:${RELEASE_TAG}" \
              | gzip -9 > "dist/mirror-registry-images-${RELEASE_TAG}-linux-${ARCH}.tar.gz"
            docker rmi -f "${BACKEND_IMAGE}:${RELEASE_TAG}" "${NGINX_IMAGE}:${RELEASE_TAG}"
          done

          sed \
            -e "s|ghcr.io/amkargar/mirror-registry|${IMAGE_PREFIX}|g" \
            -e "s|MIRROR_REGISTRY_TAG:-latest|MIRROR_REGISTRY_TAG:-${RELEASE_TAG}|g" \
            docker-compose.release.yml > dist/docker-compose.release.yml

          (
            cd dist
            sha256sum \
              "mirror-registry-images-${RELEASE_TAG}-linux-amd64.tar.gz" \
              "mirror-registry-images-${RELEASE_TAG}-linux-arm64.tar.gz" \
              "docker-compose.release.yml" > SHA256SUMS.txt
          )

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend_image }}
          NGINX_IMAGE: ${{ steps.meta.outputs.nginx_image }}
        run: |
          cat <<EOF > /tmp/RELEASE_NOTES.md
          ## Mirror Registry ${RELEASE_TAG}

          ### Container Images (GHCR — \`linux/amd64\` & \`linux/arm64\`)
          - \`${BACKEND_IMAGE}:${RELEASE_TAG}\`
          - \`${NGINX_IMAGE}:${RELEASE_TAG}\`

          ### Quick Start on Your PC (Pull from GHCR)
          1. Download \`docker-compose.release.yml\` from the **Assets** section below.
          2. Start the stack:
             \`\`\`bash
             HTTP_PORT=8080 docker compose -f docker-compose.release.yml up -d
             \`\`\`
          3. Read the generated administrator password once from the log:
             \`\`\`bash
             docker compose -f docker-compose.release.yml logs backend | grep "generated for the initial admin"
             \`\`\`
             To choose your own instead, set it before starting (12+ characters):
             \`ADMIN_PASSWORD='your-strong-password' HTTP_PORT=8080 docker compose -f docker-compose.release.yml up -d\`
          4. Open \`http://localhost:8080\` and sign in as \`admin\`.`

          ### Quick Start Using the Release Image Archive (Offline / No GHCR Login)
          1. Download \`docker-compose.release.yml\` and the image archive matching your PC from **Assets**:
             - Intel/AMD (Windows, Linux, Intel Mac): \`mirror-registry-images-${RELEASE_TAG}-linux-amd64.tar.gz\`
             - Apple Silicon (M1–M4 Mac) / ARM64 Linux: \`mirror-registry-images-${RELEASE_TAG}-linux-arm64.tar.gz\`
          2. Load the images into Docker and start:
             \`\`\`bash
             docker load -i mirror-registry-images-${RELEASE_TAG}-linux-amd64.tar.gz
             HTTP_PORT=8080 docker compose -f docker-compose.release.yml up -d
             \`\`\`

          Verify downloads with \`sha256sum -c SHA256SUMS.txt\`.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          EXTRA_ARGS=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Mirror Registry ${RELEASE_TAG}" \
              --notes-file /tmp/RELEASE_NOTES.md \
              "${EXTRA_ARGS[@]}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "Mirror Registry ${RELEASE_TAG}" \
              --notes-file /tmp/RELEASE_NOTES.md \
              "${EXTRA_ARGS[@]}"
          fi
